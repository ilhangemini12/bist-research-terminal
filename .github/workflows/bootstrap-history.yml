name: Bootstrap History
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Ticker offset in current configured universe"
        required: true
        default: "0"
      limit:
        description: "Bounded ticker batch size"
        required: true
        default: "50"
  push:
    branches: [main]
    paths:
      - '.github/triggers/bootstrap-history'
permissions:
  contents: write
concurrency:
  group: bist-history-writer
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main before binary state work
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate history code
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_yahoo_history.py tests/test_duckdb_persistence.py tests/test_technical.py
      - name: Resolve bounded history request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            OFFSET=0; LIMIT=50
            while IFS='=' read -r key value; do
              case "$key" in
                offset) OFFSET="$value" ;;
                limit) LIMIT="$value" ;;
              esac
            done < .github/triggers/bootstrap-history
          else
            OFFSET="${{ inputs.offset }}"; LIMIT="${{ inputs.limit }}"
          fi
          echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "HISTORY_REQUEST offset=$OFFSET limit=$LIMIT"
      - name: Fetch incremental history
        run: python scripts/bootstrap_history.py --offset "${{ steps.request.outputs.offset }}" --limit "${{ steps.request.outputs.limit }}"
      - name: Commit incremental history state
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/daily_ohlcv.parquet data/parquet/corporate_actions.parquet || true
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "data: bootstrap history offset ${{ steps.request.outputs.offset }}"
          # Do not rebase binary Parquet after processing. If main moved during
          # this bounded run, fail safely and rerun from the latest main state.
          git push origin HEAD:main
