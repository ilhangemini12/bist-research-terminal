name: Bootstrap History
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Ticker offset in current configured universe"
        required: true
        default: "0"
      limit:
        description: "Bounded ticker batch size"
        required: true
        default: "25"
  push:
    branches: [main]
    paths:
      - '.github/triggers/bootstrap-history'
permissions:
  contents: write
concurrency:
  group: bist-data-writer
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src scripts
      - run: python scripts/bootstrap_history.py --offset "${{ inputs.offset || '0' }}" --limit "${{ inputs.limit || '5' }}"
      - name: Commit incremental history state
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/daily_ohlcv.parquet data/parquet/corporate_actions.parquet || true
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "data: bootstrap history batch ${{ inputs.offset || '0' }}"
          git pull --rebase origin main
          git push origin HEAD:main
