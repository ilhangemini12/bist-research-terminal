name: Bootstrap source tree
# bootstrap revision: sha-verified-text-parts-r2

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/base64/**'
      - '.github/workflows/bootstrap-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-source-tree
  cancel-in-progress: false

jobs:
  unpack-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/base64/part-*.txt > /tmp/source.b64
          actual_len="$(wc -c < /tmp/source.b64)"
          echo "Base64 length: $actual_len"
          test "$actual_len" -eq 173416
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "37c7df418506054a9951688112664cc75008998070ba573be720b70273f90340  /tmp/source.zip" | sha256sum -c -
          unzip -tq /tmp/source.zip

      - name: Unpack source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bist-src
          mkdir -p /tmp/bist-src
          unzip -q /tmp/source.zip -d /tmp/bist-src
          rsync -a /tmp/bist-src/ ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-upload.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unit and stress tests
        run: python -m pytest -q

      - name: JavaScript safe-formula tests
        run: node dashboard/tests/formula.test.js

      - name: Compile and workflow syntax checks
        shell: bash
        run: |
          python -m compileall -q src scripts tests stress_tests
          node --check dashboard/app.js
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          print('WORKFLOW_YAML_OK')
          PY

      - name: Commit validated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: bootstrap validated BIST Research Terminal V2"
          git push origin HEAD:main
