name: Broker Public Model Portfolio Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/broker-public-probe'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Probe bounded public pages
        run: |
          python -m compileall -q scripts/probe_broker_public_models.py
          python scripts/probe_broker_public_models.py
      - name: Commit probe checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/broker_public_probe.json
          if git diff --cached --quiet; then
            echo "No broker probe changes to commit."
            exit 0
          fi
          git commit -m "report: broker public model-portfolio probe"
          git pull --rebase origin main
          git push origin HEAD:main
