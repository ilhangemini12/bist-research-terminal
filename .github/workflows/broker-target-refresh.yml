name: Broker Target Refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/broker-target-refresh'
  schedule:
    - cron: '45 16 * * 1-5'
permissions:
  contents: write
concurrency:
  group: bist-broker-target-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate broker target parser
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_gedik_model.py tests/test_broker_target_files.py
      - name: Refresh public Gedik target snapshot
        run: python scripts/bootstrap_broker_targets.py
      - name: Commit immutable broker snapshot
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/broker_targets/*.parquet || true
          if git diff --cached --quiet; then
            echo "No broker target changes to commit."
            exit 0
          fi
          git commit -m "data: broker target snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
