name: Capital refresh safe offline CI
on:
  push:
    branches: [main, repair/kap-daily-request-budget-20261102]
    paths:
      - 'src/bist_terminal/pipeline/capital_refresh.py'
      - 'tests/test_capital_refresh.py'
      - '.github/workflows/capital-budget-ci.yml'
  pull_request:
    paths:
      - 'src/bist_terminal/pipeline/capital_refresh.py'
      - 'tests/test_capital_refresh.py'
      - '.github/workflows/capital-budget-ci.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test KAP refresh without network
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/bist_terminal/pipeline/capital_refresh.py tests/test_capital_refresh.py
          python -m pytest -q tests/test_capital_refresh.py tests/test_kap_capital.py
