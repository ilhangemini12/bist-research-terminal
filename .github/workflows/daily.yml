name: Daily Update
on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Optional manual BIST trade date YYYY-MM-DD; blank keeps normal current-day behavior"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - '.github/triggers/daily'
  schedule:
    # 18:25 Turkey time = 15:25 UTC while Turkey remains UTC+3
    - cron: '25 15 * * 1-5'
permissions:
  contents: write
concurrency:
  group: bist-main-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate, regenerate and publish from latest main
        shell: bash
        env:
          DISPATCH_AS_OF: ${{ github.event.inputs.as_of_date || '' }}
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"

          AS_OF="$DISPATCH_AS_OF"
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f .github/triggers/daily ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                as_of) AS_OF="$value" ;;
              esac
            done < .github/triggers/daily
          fi
          if [[ -n "$AS_OF" ]]; then
            export BIST_AS_OF_DATE="$AS_OF"
            echo "DAILY_MANUAL_AS_OF=$BIST_AS_OF_DATE"
          else
            unset BIST_AS_OF_DATE || true
          fi

          for ATTEMPT in 1 2; do
            echo "DAILY_PUBLISH_ATTEMPT=$ATTEMPT"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python -m compileall -q src scripts tests stress_tests
            node --check dashboard/app.js
            node dashboard/tests/formula.test.js
            node dashboard/tests/ui_regression.test.js
            pytest

            python scripts/run_daily.py
            python scripts/build_excel_snapshot.py
            python scripts/build_report.py

            git add dashboard/data artifacts data/parquet || true
            if git diff --cached --quiet; then
              echo "No daily changes to commit."
              echo "DAILY_PUBLISH_OK attempt=$ATTEMPT no_changes=true"
              break
            fi

            git commit -m "data: daily refresh"
            if git push origin HEAD:main; then
              echo "DAILY_PUBLISH_OK attempt=$ATTEMPT"
              break
            fi

            if [[ "$ATTEMPT" == "2" ]]; then
              echo "DAILY_PUBLISH_ABORT two push races; do not retry identical method"
              exit 1
            fi
            echo "DAILY_PUBLISH_RACE retrying once from latest main"
          done
      - name: Upload daily research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIST-Research-Latest
          path: |
            artifacts/BIST_Research_Latest.xlsx
            artifacts/build_report.json
            dashboard/data/latest.json
          if-no-files-found: error
          retention-days: 14
