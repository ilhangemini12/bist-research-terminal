name: Daily Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/daily'
  schedule:
    # 18:25 Turkey time = 15:25 UTC while Turkey remains UTC+3
    - cron: '25 15 * * 1-5'
permissions:
  contents: write
concurrency:
  group: bist-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m compileall -q src scripts tests stress_tests
          node --check dashboard/app.js
          node dashboard/tests/formula.test.js
      - run: pytest
      - name: Run live pipeline
        run: python scripts/run_daily.py
      - name: Build Excel snapshot
        run: python scripts/build_excel_snapshot.py
      - name: Build current status report
        run: python scripts/build_report.py
      - name: Upload daily research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIST-Research-Latest
          path: |
            artifacts/BIST_Research_Latest.xlsx
            artifacts/build_report.json
            dashboard/data/latest.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed static data and artifact
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data artifacts || true
          if git diff --cached --quiet; then
            echo "No daily changes to commit."
            exit 0
          fi
          git commit -m "data: daily refresh"
          git pull --rebase origin main
          git push origin HEAD:main
