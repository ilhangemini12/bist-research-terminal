name: Discover KAP Client Endpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/kap-client-discovery'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - run: python scripts/discover_kap_client_endpoints.py
