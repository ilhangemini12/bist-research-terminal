name: Financial Backfill
on:
  workflow_dispatch:
    inputs:
      year:
        description: "KAP financial archive year"
        required: true
        default: "2025"
      period:
        description: "1=3M, 2=6M, 3=9M, 4=FY"
        required: true
        default: "4"
      offset:
        description: "Ticker offset"
        required: true
        default: "0"
      limit:
        description: "Ticker batch size; 0 = all remaining"
        required: true
        default: "50"
      tickers:
        description: "Optional comma-separated smoke subset"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - '.github/triggers/financial-backfill'
permissions:
  contents: write
concurrency:
  group: bist-financial-sharded-writer
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main before financial checkpoint work
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate financial parser
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_kap_bulk_financials.py tests/test_financial_files.py tests/test_fundamental.py
      - name: Resolve bounded backfill request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            YEAR=2025; PERIOD=4; OFFSET=0; LIMIT=50; TICKERS=""
            while IFS='=' read -r key value; do
              case "$key" in
                year) YEAR="$value" ;;
                period) PERIOD="$value" ;;
                offset) OFFSET="$value" ;;
                limit) LIMIT="$value" ;;
                tickers) TICKERS="$value" ;;
              esac
            done < .github/triggers/financial-backfill
          else
            YEAR="${{ inputs.year }}"; PERIOD="${{ inputs.period }}"
            OFFSET="${{ inputs.offset }}"; LIMIT="${{ inputs.limit }}"
            TICKERS="${{ inputs.tickers }}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"
          echo "FINANCIAL_REQUEST year=$YEAR period=$PERIOD offset=$OFFSET limit=$LIMIT tickers=$TICKERS"
      - name: Ingest KAP financial archive
        run: |
          python scripts/bootstrap_financials.py             --year "${{ steps.request.outputs.year }}"             --period "${{ steps.request.outputs.period }}"             --offset "${{ steps.request.outputs.offset }}"             --limit "${{ steps.request.outputs.limit }}"             --tickers "${{ steps.request.outputs.tickers }}"
      - name: Commit normalized financial state
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/financials/*.parquet || true
          if git diff --cached --quiet; then
            echo "No financial changes to commit."
            exit 0
          fi
          git commit -m "data: financial shard ${{ steps.request.outputs.year }}-${{ steps.request.outputs.period }} offset ${{ steps.request.outputs.offset }}"
          git pull --rebase origin main
          git push origin HEAD:main
