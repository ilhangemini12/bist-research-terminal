name: Financial Period Explicit
on:
  workflow_dispatch:
    inputs:
      year:
        required: true
        default: "2026"
      period:
        required: true
        default: "2"
  push:
    branches: [main]
    paths:
      - '.github/triggers/financial-period-explicit'
permissions:
  contents: write
concurrency:
  group: bist-financial-period-explicit
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            YEAR=2026; PERIOD=2
            while IFS='=' read -r key value; do
              case "$key" in
                year) YEAR="$value" ;;
                period) PERIOD="$value" ;;
              esac
            done < .github/triggers/financial-period-explicit
          else
            YEAR="${{ inputs.year }}"
            PERIOD="${{ inputs.period }}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
      - name: Validate period checkpoint code
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_kap_bulk_financials.py tests/test_financial_files.py tests/test_financial_quarterly.py tests/test_financial_history.py tests/test_fundamental.py
      - name: Build one immutable financial period
        run: |
          python scripts/bootstrap_financials.py             --year "${{ steps.request.outputs.year }}"             --period "${{ steps.request.outputs.period }}"             --offset 0 --limit 0
      - name: Commit one-period checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/financials/*.parquet || true
          if git diff --cached --quiet; then
            echo "FINANCIAL_PERIOD_NOOP"
            exit 0
          fi
          git commit -m "data: financial period ${{ steps.request.outputs.year }}-${{ steps.request.outputs.period }} explicit"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "FINANCIAL_PERIOD_CHECKPOINT_OK"
