name: Insurance Financial Repair
on:
  workflow_dispatch:
    inputs:
      year:
        description: "KAP financial archive year"
        required: true
        default: "2025"
      version:
        description: "Immutable repair overlay version"
        required: true
        default: "1"
  push:
    branches: [main]
    paths:
      - '.github/triggers/insurance-financial-repair'
permissions:
  contents: write
concurrency:
  group: bist-main-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate repair code
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_kap_bulk_financials.py tests/test_financial_files.py tests/test_financial_quarterly.py
      - name: Resolve repair request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            YEAR=2025; VERSION=1
            while IFS='=' read -r key value; do
              case "$key" in
                year) YEAR="$value" ;;
                version) VERSION="$value" ;;
              esac
            done < .github/triggers/insurance-financial-repair
          else
            YEAR="${{ inputs.year }}"; VERSION="${{ inputs.version }}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build insurance repair overlay
        run: python scripts/repair_insurance_financials.py --year "${{ steps.request.outputs.year }}" --version "${{ steps.request.outputs.version }}"
      - name: Commit repair checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/financials/financials_repair_insurance_*.parquet || true
          if git diff --cached --quiet; then
            echo "No insurance repair changes to commit."
            exit 0
          fi
          git commit -m "data: insurance financial repair ${{ steps.request.outputs.year }} v${{ steps.request.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
