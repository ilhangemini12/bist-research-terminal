name: ISATR Price Gap Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/isatr-price-audit'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Audit approved price lineages only
        run: |
          python -m compileall -q scripts/audit_isatr_price_gap.py
          python scripts/audit_isatr_price_gap.py
      - name: Commit audit checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/isatr_price_gap_audit.json
          git commit -m "report: ISATR price gap audit" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
