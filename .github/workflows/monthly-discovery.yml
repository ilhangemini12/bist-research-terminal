name: Monthly Source Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/monthly-discovery'
  schedule:
    - cron: '15 6 1 * *'
permissions:
  contents: write
concurrency:
  group: bist-data-writer
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Static checks
        run: python -m compileall -q src scripts
      - run: python scripts/discover_sources.py
      - name: Commit discovery snapshot
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/discovery config/source_catalog.yaml || true
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi
          git commit -m "discovery: monthly official registry refresh"
          git pull --rebase origin main
          git push origin HEAD:main
