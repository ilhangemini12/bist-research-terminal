name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Daily Update', 'Broker Target Refresh']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard payload
        run: |
          set -euo pipefail
          test -f dashboard/index.html
          test -f dashboard/app.js
          test -f dashboard/data/latest.json
          node --check dashboard/app.js
          node dashboard/tests/formula.test.js
          node dashboard/tests/ui_regression.test.js
          node --test dashboard/tests/research.test.js tests/pwa.test.js
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("dashboard/data/latest.json").read_text())
          print("DASHBOARD_PAYLOAD_OK")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real mobile browser, offline and cache acceptance
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/bist-browser" playwright@1.56.1 --no-audit --no-fund
          node "$RUNNER_TEMP/bist-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m http.server 8766 --bind 127.0.0.1 --directory dashboard > "$RUNNER_TEMP/bist-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8766/ > /dev/null && break
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/bist-browser/node_modules" node dashboard/tests/browser_e2e.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
