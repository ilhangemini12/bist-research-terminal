name: Probe BIST Bulletin Paths
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/bist-bulletin-probe'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts/probe_bist_bulletin.py
      - name: Probe official BIST file path archive
        run: python scripts/probe_bist_bulletin.py
