name: Probe PRZMA Financial Labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/przma-financial-probe'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - run: python scripts/probe_przma_financial_labels.py
