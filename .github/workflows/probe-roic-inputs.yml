name: Probe ROIC Inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/roic-input-probe'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate parser and probe
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_roic_inputs.py tests/test_kap_bulk_financials.py
          python scripts/probe_roic_inputs.py
