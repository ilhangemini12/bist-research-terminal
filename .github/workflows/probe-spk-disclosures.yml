name: Probe SPK Disclosure Schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/spk-disclosure-probe'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts/probe_spk_disclosures.py
      - run: python scripts/probe_spk_disclosures.py
