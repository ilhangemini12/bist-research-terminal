name: Probe SPK Financial Schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_spk_financials.py'
      - '.github/workflows/probe-spk-financials.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Probe documented SPK financial endpoints
        run: python scripts/probe_spk_financials.py
