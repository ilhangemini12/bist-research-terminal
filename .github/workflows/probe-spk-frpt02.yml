name: Probe SPK FRPT02 Text Layer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/spk-frpt02-probe'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt pypdf
      - name: Probe FRPT02 PDF text layer
        run: python scripts/probe_spk_frpt02_text.py
