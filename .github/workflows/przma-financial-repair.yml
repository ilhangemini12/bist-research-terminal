name: PRZMA Financial Repair
on:
  workflow_dispatch:
    inputs:
      year:
        description: "KAP year"
        required: true
        default: "2026"
      periods:
        description: "Space-separated KAP periods"
        required: true
        default: "1 2"
  push:
    branches: [main]
    paths:
      - '.github/triggers/przma-financial-repair'
permissions:
  contents: write
concurrency:
  group: bist-financial-sharded-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Resolve repair request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            YEAR=2026
            PERIODS="1 2"
            while IFS='=' read -r key value; do
              case "$key" in
                year) YEAR="$value" ;;
                periods) PERIODS="$value" ;;
              esac
            done < .github/triggers/przma-financial-repair
          else
            YEAR="${{ inputs.year }}"
            PERIODS="${{ inputs.periods }}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "periods=$PERIODS" >> "$GITHUB_OUTPUT"
      - name: Validate parser and build repair
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_kap_bulk_financials.py
          python scripts/repair_przma_financials.py --year "${{ steps.request.outputs.year }}" --periods "${{ steps.request.outputs.periods }}"
      - name: Commit repair checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/financials/financials_repair_przma_*.parquet || true
          if git diff --cached --quiet; then
            echo "No PRZMA repair changes to commit."
            exit 0
          fi
          git commit -m "data: PRZMA financial repair ${{ steps.request.outputs.year }}"
          git pull --rebase origin main
          git push origin HEAD:main
