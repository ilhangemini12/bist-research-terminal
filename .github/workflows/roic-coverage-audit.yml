name: ROIC Coverage Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/roic-coverage-audit'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate and audit ROIC
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_roic_inputs.py tests/test_roic_input_files.py
          python scripts/audit_roic_coverage.py
      - name: Commit ROIC audit checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/roic_coverage_report.json
          if git diff --cached --quiet; then
            echo "No ROIC audit changes to commit."
            exit 0
          fi
          git commit -m "report: ROIC coverage audit"
          git pull --rebase origin main
          git push origin HEAD:main
