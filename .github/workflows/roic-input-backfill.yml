name: ROIC Input Backfill
on:
  workflow_dispatch:
    inputs:
      checkpoints:
        description: "Space-separated year:period checkpoints"
        required: true
        default: "2025:2 2025:4 2026:2"
  push:
    branches: [main]
    paths:
      - '.github/triggers/roic-input-backfill'
permissions:
  contents: write
concurrency:
  group: bist-roic-input-writer
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate ROIC checkpoint code
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_roic_inputs.py tests/test_roic_input_files.py tests/test_kap_bulk_financials.py
      - name: Resolve checkpoints
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHECKPOINTS="2025:2 2025:4 2026:2"
            while IFS='=' read -r key value; do
              case "$key" in
                checkpoints) CHECKPOINTS="$value" ;;
              esac
            done < .github/triggers/roic-input-backfill
          else
            CHECKPOINTS="${{ inputs.checkpoints }}"
          fi
          echo "checkpoints=$CHECKPOINTS" >> "$GITHUB_OUTPUT"
          echo "ROIC_INPUT_REQUEST checkpoints=$CHECKPOINTS"
      - name: Backfill and checkpoint each ROIC period
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          for ITEM in ${{ steps.request.outputs.checkpoints }}; do
            YEAR="${ITEM%%:*}"
            PERIOD="${ITEM##*:}"
            echo "ROIC_INPUT_PERIOD_START year=$YEAR period=$PERIOD"
            git fetch origin main
            git pull --rebase origin main
            python scripts/bootstrap_roic_inputs.py --year "$YEAR" --period "$PERIOD"
            git add data/parquet/roic_inputs/*.parquet || true
            if git diff --cached --quiet; then
              echo "ROIC_INPUT_PERIOD_NOOP year=$YEAR period=$PERIOD"
            else
              git commit -m "data: ROIC input shard $YEAR-$PERIOD"
              git pull --rebase origin main
              git push origin HEAD:main
              echo "ROIC_INPUT_PERIOD_CHECKPOINT_OK year=$YEAR period=$PERIOD"
            fi
          done
          echo "ROIC_INPUT_BACKFILL_DONE"
