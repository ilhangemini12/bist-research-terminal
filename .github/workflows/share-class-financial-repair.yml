name: Share Class Financial Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/share-class-financial-repair'
permissions:
  contents: write
concurrency:
  group: bist-financial-sharded-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Validate same-issuer share-class repair
        run: |
          python -m compileall -q src scripts
          pytest -q tests/test_share_class_financial_repair.py
          python scripts/repair_share_class_financials.py
      - name: Commit repair checkpoint
        run: |
          set -euo pipefail
          git config user.name "bist-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parquet/financials/financials_repair_share_classes_v001.parquet
          if git diff --cached --quiet; then
            echo "No share-class repair changes to commit."
            exit 0
          fi
          git commit -m "data: repair exact-issuer share-class financials"
          git pull --rebase origin main
          git push origin HEAD:main
