[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-research-terminal"
version = "0.2.0"
description = "Free-first, multi-source, verified personal BIST research terminal"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2.0,<3", "requests>=2.32,<3", "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "duckdb>=1.1,<2", "pyarrow>=17,<25", "XlsxWriter>=3.2,<4", "openpyxl>=3.1,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "stress_tests"]
addopts = "-q"
